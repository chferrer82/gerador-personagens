<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salão da Forja — Gerador de Personagens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;800&family=Alegreya:ital,wght@1,500&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Salão da forja: pedra escura, brasa, ouro da honra, aço da justiça. Uma conversa por tela. */
:root{
  --pedra:#17120e; --pedra2:#211a14; --pedra3:#2d241c; --veio:#4a3b2e;
  --tinta:#f1e7d6; --cinza:#b9a993; --brasa:#ff7b2e; --forja:#c4441a;
  --ouro:#e3b34c; --aco:#86aecb; --erro:#ff9b8a;
  --display:"Grenze Gotisch","Palatino Linotype",Georgia,serif;
  --voz:"Alegreya",Georgia,serif;
  --texto:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--pedra);color:var(--tinta);font:17px/1.55 var(--texto);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:
    radial-gradient(ellipse 120% 60% at 50% 115%,rgba(196,68,26,.35),transparent 60%),
    radial-gradient(ellipse 80% 50% at 15% 0%,rgba(134,174,203,.07),transparent 60%),
    repeating-linear-gradient(115deg,rgba(255,255,255,.012) 0 2px,transparent 2px 9px);
  background-attachment:fixed;overflow-x:hidden}
#brasas{position:fixed;inset:0;pointer-events:none;z-index:0}
.cena{position:relative;z-index:1;max-width:640px;margin:0 auto;padding-block:20px 130px}
.oculto{display:none!important}
:focus-visible{outline:3px solid var(--ouro);outline-offset:3px}
b{color:var(--brasa);font-weight:700}

/* ---------- Abertura ---------- */
#abertura{min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;gap:28px;padding-bottom:0}
.runa{font:800 .8rem/1 var(--texto);letter-spacing:.32em;text-transform:uppercase;color:var(--ouro);opacity:.85;text-align:center}
.pilha{display:flex;flex-direction:column;gap:14px;min-height:46vh;justify-content:flex-end}
.frase{font:500 italic clamp(1.25rem,5.2vw,1.6rem)/1.38 var(--voz);text-wrap:balance;margin:0;
  transition:opacity 1.6s ease,filter 1.6s ease,transform 1.6s ease,font-size 1.6s ease}
.frase.nova{opacity:0;transform:translateY(14px);filter:blur(6px)}
.frase.passada{opacity:.4;filter:blur(1px);transform:scale(.94);transform-origin:left center;font-size:clamp(1rem,4vw,1.15rem)}
.frase.passada.longe{opacity:.15;filter:blur(2.5px)}
.acoes{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* ---------- Botões ---------- */
.btn{font:700 1.02rem var(--texto);border-radius:12px;padding:12px 20px;cursor:pointer;border:1px solid transparent;color:#1b120b;
  background:linear-gradient(180deg,#f0c463,var(--ouro) 55%,#b9852b);box-shadow:0 0 0 1px #6b4b16 inset,0 6px 18px rgba(227,179,76,.25);transition:transform .15s,box-shadow .2s,opacity .2s}
.btn:hover{box-shadow:0 0 0 1px #6b4b16 inset,0 8px 26px rgba(255,123,46,.35)}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.35;cursor:default;box-shadow:none}
.btn.sec{background:rgba(0,0,0,.25);color:var(--tinta);border-color:var(--veio);box-shadow:none}
.btn.sec:hover{border-color:var(--brasa)}
.btn.perigo{background:linear-gradient(180deg,#e0623a,var(--forja));color:#fff2e6;box-shadow:none}
.pular,.linkbtn{background:none;border:none;color:var(--cinza);font:500 .95rem var(--texto);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 4px}
.linkbtn:hover,.pular:hover{color:var(--ouro)}
.golpe{animation:golpe .32s ease-out}
@keyframes golpe{0%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-1px,1px)}100%{transform:none}}

/* ---------- Abas ---------- */
.trilha{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:18px;scrollbar-width:none}
.trilha::-webkit-scrollbar{display:none}
.trilha button{flex:0 0 auto;font:600 .85rem var(--texto);padding:7px 12px;border-radius:999px;border:1px solid var(--veio);color:var(--cinza);background:rgba(0,0,0,.25);cursor:pointer}
.trilha button:disabled{opacity:.35;cursor:default}
.trilha button.feita{border-color:var(--ouro);color:var(--ouro)}
.trilha button[aria-current="step"]{background:var(--forja);border-color:var(--brasa);color:#fff2e6;box-shadow:0 0 14px rgba(255,123,46,.45)}

/* ---------- Conversa ---------- */
.quem{display:block;font:700 .76rem var(--texto);letter-spacing:.18em;text-transform:uppercase;color:var(--ouro);margin-bottom:10px}
.historico{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.hist{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hist .frase{opacity:.42;filter:blur(.5px);font-size:clamp(.98rem,3.8vw,1.1rem);transition:none}
.hist .frase b{color:inherit}
.resp{font:600 .95rem var(--texto);color:var(--ouro);background:rgba(227,179,76,.08);border:1px solid rgba(227,179,76,.45);border-radius:999px;padding:5px 12px;cursor:pointer;text-align:left;max-width:100%}
.resp::after{content:" ✎";opacity:.7}
.resp:hover{border-color:var(--ouro)}
.todos summary{cursor:pointer;color:var(--cinza);font-weight:700}
.todos .lista{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.todos .lin{display:flex;flex-direction:column;gap:3px}
.todos .lin span{font-size:.86rem;color:var(--cinza)}
.atual{display:flex;flex-direction:column;gap:14px}
.fala{font:500 italic clamp(1.3rem,5.4vw,1.65rem)/1.38 var(--voz);margin:0;text-wrap:balance;transition:opacity 1.2s ease,filter 1.2s ease,transform 1.2s ease}
.fala.nova{opacity:0;filter:blur(6px);transform:translateY(12px)}
.pergunta{margin:0;font:700 1.05rem var(--texto);color:var(--aco);letter-spacing:.01em}
.grade,.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.grade.um{grid-template-columns:1fr}
.opt{text-align:left;border:1px solid var(--veio);background:rgba(0,0,0,.28);color:var(--tinta);border-radius:12px;padding:10px 12px;font:600 1rem var(--texto);cursor:pointer;transition:border-color .2s,box-shadow .2s}
.opt small{display:block;font-weight:400;color:var(--cinza);font-size:.84rem}
.opt:hover{border-color:var(--brasa)}
.opt[aria-pressed="true"]{border-color:var(--ouro);background:linear-gradient(180deg,rgba(227,179,76,.18),rgba(227,179,76,.06));box-shadow:0 0 0 1px var(--ouro) inset,0 0 18px rgba(227,179,76,.25)}
.opt .sug{float:right;font-size:.72rem;color:var(--aco);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
select,input[type=text],input[type=number],textarea{width:100%;font:1rem var(--texto);color:var(--tinta);background:rgba(0,0,0,.35);border:1px solid var(--veio);border-radius:12px;padding:11px 12px}
select:focus,input:focus,textarea:focus{border-color:var(--ouro);outline:none;box-shadow:0 0 0 2px rgba(227,179,76,.35)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
textarea.longo{min-height:300px}
option,optgroup{background:var(--pedra2);color:var(--tinta)}
label.f{display:block;font-weight:700;font-size:.92rem;color:var(--cinza);margin:2px 0 -8px}
.linha{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.linha input{flex:1 1 160px;width:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{color:var(--cinza);font-size:.92rem;margin:0}
.err{color:var(--erro);font-weight:600;margin:0}
.wip{color:var(--aco);font-weight:600;margin:0}
.what{font-weight:700;color:var(--aco)}
.raros summary{cursor:pointer;font-weight:700;color:var(--cinza);padding:4px 0}
.raros .grade{margin-top:8px}
.desc{padding:12px 14px;border-radius:12px;border:1px solid rgba(227,179,76,.35);background:linear-gradient(180deg,rgba(227,179,76,.10),rgba(0,0,0,.15));transition:opacity .7s,filter .7s,transform .7s}
.desc.nova{opacity:0;filter:blur(4px);transform:translateY(6px)}
.desc .nome{font:800 1.35rem/1.1 var(--display);color:var(--ouro);margin:0 0 4px}
.desc p{margin:0 0 10px;font:500 italic 1.06rem/1.45 var(--voz)}

/* Dado: pedra gravada que acende */
.dado{display:flex;gap:12px;align-items:center}
.pedra{width:58px;height:58px;flex:0 0 auto}
.pedra svg{width:100%;height:100%;overflow:visible}
.pedra .face{fill:#2b221b;stroke:var(--veio);stroke-width:3;transition:stroke .3s,filter .3s}
.pedra.acesa .face{stroke:var(--brasa);filter:drop-shadow(0 0 7px rgba(255,123,46,.8))}
.pedra .num{font-family:var(--display);font-weight:800;fill:var(--tinta)}
.pedra .dt{font:700 11px var(--texto);fill:var(--cinza)}
.pedra.rolando svg{animation:rola .55s cubic-bezier(.2,.8,.2,1)}
@keyframes rola{0%{transform:rotate(-200deg) scale(.6)}70%{transform:rotate(12deg) scale(1.08)}100%{transform:none}}
.dctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.btn.dadob{padding:9px 14px;font-size:.95rem}
.mesa{display:flex;gap:8px;width:100%}
.mesa input{max-width:120px}

/* Atributos */
.pb{display:grid;grid-template-columns:1fr auto auto auto;gap:8px 10px;align-items:center}
.pb button{width:40px;height:40px;border-radius:10px;border:1px solid var(--veio);background:rgba(0,0,0,.3);color:var(--tinta);font:700 1.2rem var(--texto);cursor:pointer}
.pb button:hover{border-color:var(--brasa)}
.pb b{color:var(--ouro);font-size:1.15rem}
.pb.bon{grid-template-columns:auto 1fr}
.scroll{overflow-x:auto}
table.at{width:100%;border-collapse:collapse;font-size:.95rem}
table.at th,table.at td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--veio);vertical-align:top}
table.at th{color:var(--cinza);font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em}
table.at td.n{font:800 1.25rem var(--display);color:var(--ouro)}
.tag{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--aco);margin-left:6px}

/* História e ficha */
.historia{border-left:3px solid var(--forja);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:10px}
.historia p{margin:0}
.historia b{color:var(--ouro)}
pre.ficha{white-space:pre-wrap;word-break:break-word;font:15px/1.5 var(--texto);background:rgba(0,0,0,.35);border:1px solid var(--veio);border-radius:12px;padding:14px;margin:0}
.envio{border-top:1px solid var(--veio);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.envio h3{margin:0;font:800 1.3rem var(--display);color:var(--ouro);letter-spacing:.02em}

/* Rodapé */
.rodape{position:fixed;left:0;right:0;bottom:0;z-index:2;background:linear-gradient(180deg,rgba(23,18,14,0),rgba(23,18,14,.94) 32%);padding:18px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.rodape .in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}

/* Janela de confirmação */
.modal{position:fixed;inset:0;z-index:5;background:rgba(8,6,4,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{max-width:440px;width:100%;background:var(--pedra2);border:1px solid var(--ouro);border-radius:14px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.modal .box p{margin:0 0 14px}

@media (prefers-reduced-motion:reduce){
  .frase,.fala,.desc{transition:none}.frase.nova,.fala.nova,.desc.nova{opacity:1;filter:none;transform:none}
  .pedra.rolando svg,.golpe{animation:none}
}
@media print{
  body{background:#fff;color:#000}
  body *{visibility:hidden}
  #ficha,#ficha *{visibility:visible}
  #ficha{position:absolute;left:0;top:0;width:100%;border:none;background:#fff;color:#000;font-size:12pt}
}
</style>
</head>
<body>
<canvas id="brasas" aria-hidden="true"></canvas>

<main class="cena">
  <section id="abertura" aria-live="polite">
    <div class="runa">ᚦ · Salão da Forja · ᚦ</div>
    <div class="pilha" id="pilha"></div>
    <div class="acoes">
      <button class="pular" id="pular" type="button">Pular apresentação</button>
      <button class="pular oculto" id="novo" type="button">Começar do zero</button>
      <button class="btn oculto" id="comecar" type="button">Acender a forja</button>
    </div>
  </section>

  <section id="app" class="oculto">
    <nav class="trilha" id="trilha" aria-label="Etapas"></nav>
    <span class="quem">O anão da forja</span>
    <div class="historico" id="historico"></div>
    <div class="atual" id="atual" aria-live="polite"></div>
  </section>
</main>

<div class="rodape oculto" id="rodape"><div class="in">
  <button class="btn sec" id="voltar" type="button">Voltar</button>
  <button class="linkbtn" id="reset" type="button">Recomeçar</button>
  <button class="btn" id="avancar" type="button">Avançar</button>
</div></div>
<div id="modal"></div>

<script>
/* =========================================================
   DADOS
   Fontes: PROJETO.md.
   ========================================================= */
// Tabelas carregadas do banco SQLite pelo servidor (Flask). Para editar, veja gerenciar.py.
const __D=/*__DADOS__*/null;
const {ATR,PATRIA,ASSENT,REG_EXTRA,ANTEC,RACAS,FMT,EXO,IDADE_EXO,RACA_SUP,CLASSES,CLASSE_SUP,SUBCL,DEUSES,IDADE,PB_CUSTO,PERFIS,ORDEM_CLASSE,ARRAY,FAIXAS,ESCALA,VAGA,DESC,DESC_CL,NOMES,NOMES2,ESTILO_LUGAR,SOB_HUMANO}=__D;
const exoRef=e=>e[4]||('x_'+e[3].toLowerCase().replace(/[^a-z]/g,''));
EXO.filter(e=>!e[4]).forEach(e=>RACAS.push({id:exoRef(e),n:e[2],en:e[3],idade:null,idx:IDADE_EXO[e[3]],rara:true,subs:[['u','—','mm']]}));

const ETAPAS=['Tom','Quem é você','De onde vem','Atributos','Crônica','Ficha'];

/* =========================================================
   ESTADO
   ========================================================= */
const S={step:0,max:0,d:{},modo:null,caminho:null,ideia:'',vaga:{},
 patria:null,assent:null,regExtra:'',mora:'mesmo',patria2:null,assent2:null,regExtra2:'',antec:null,
 raca:null,sub:null,nome:'',gen:'m',estilo:'',sobrenome:'',apelido:'',
 classe:null,subcl:'',deus:'',idade:null,
 perfil:null,estiloCl:'',pb:{FOR:8,DES:8,CON:8,INT:8,SAB:8,CAR:8},fichas:[],fmtEsc:'21',sugRaca:null,sugClasse:null,cr:{},crSel:{},crMan:{},crEdit:null,per:{},perTxt:{},histEdit:null,histBase:'',extra:'',apar:{},_res:'',notaOrigem:'',env:{jogador:''},enviado:null,envErro:'',enviando:false,pend:null,edit:null,ok:{},_idErr:''};

const S0=JSON.stringify(S);

/* =========================================================
   UTILITÁRIOS
   ========================================================= */
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rnd(s){const a=new Uint32Array(1);crypto.getRandomValues(a);return 1+(a[0]%s)}
function rollN(n,s){let t=0;for(let i=0;i<n;i++)t+=rnd(s);return t}
function faixa(tab,v){return tab.find(r=>v>=r[0]&&v<=r[1])}
const mod=v=>Math.floor((v-10)/2);
const fmtMod=m=>(m>=0?'+':'')+m;
const raca=()=>RACAS.find(r=>r.id===S.raca);
const sub=()=>{const r=raca();return r?r.subs.find(s=>s[0]===S.sub):null};
const classe=()=>CLASSES.find(c=>c.id===S.classe);
function idadeTab(){const r=raca(),s=sub();if(!r)return null;if(r.idx)return {...IDADE[r.idx[1]],a:r.idx[0]};return IDADE[(s&&s[3])||r.idade]}
function idadeDados(){const t=idadeTab(),c=classe();if(!t||!c)return null;const [n,s]=t[c.g];return {a:t.a,n,s,min:t.a+n,max:t.a+n*s}}


/* =========================================================
   COMPONENTE DE DADO
   ========================================================= */
const DIE_FX={}; // efeito ao definir resultado
function setDie(key,v,auto){
 if(['patria','assent','antec'].includes(key)&&(Object.keys(S.cr).length||Object.keys(S.per).length)){S.cr={};S.crSel={};S.per={};['pt1','pt2','pid','pvi','pdf'].forEach(k=>delete S.d[k])}
 S.d[key]={v};(DIE_FX[key.split(':')[0]]||(()=>{}))(v,key,auto);render(true)}

DIE_FX.patria=v=>{S.patria=faixa(PATRIA,v)[2];S.assent=null;delete S.d.assent;S.regExtra='';S.notaOrigem=''};
DIE_FX.assent=v=>{S.assent=faixa(ASSENT[S.patria],v)[2];S.notaOrigem=''};
DIE_FX.patria2=v=>{S.patria2=faixa(PATRIA,v)[2];S.assent2=null;delete S.d.assent2;S.regExtra2=''};
DIE_FX.assent2=v=>{S.assent2=faixa(ASSENT[S.patria2],v)[2]};
DIE_FX.antec=v=>{S.antec=faixa(ANTEC,v)[2]};
function lugarOrigem(){if(S.regExtra)return S.regExtra.includes(' — ')?S.regExtra.split(' — ')[1]:S.regExtra;return S.assent||''}
function estiloAuto(){return ESTILO_LUGAR[lugarOrigem()]||'tethyriano'}
function estilo(){return S.estilo||estiloAuto()}
function listaNome(){const r=raca();if(!r)return null;return r.id==='humano'?NOMES2.H[estilo()]:NOMES[r.id]}
function listaSob(){const r=raca();if(!r)return null;if(SOB_HUMANO.includes(r.id))return {l:'Sobrenome',s:NOMES2.H[estilo()].s};const x=NOMES2.S[r.id];return x?{l:r.id==='anao'||r.id==='gnomo'||r.id==='draconato'||r.id==='golias'?'Clã':r.id==='elfo'?'Família':'Sobrenome',s:x.s}:null}
function nomeCompleto(){const r=raca(),n=S.nome.trim(),sb=S.sobrenome.trim(),ap=S.apelido.trim();if(!n)return '';
 if(r&&r.id==='draconato')return (sb?sb+' ':'')+n;
 if(r&&r.id==='golias')return n+(ap?' “'+ap+'”':'')+(sb?' '+sb:'');
 return n+(sb?' '+sb:'')}
function escolheRaca(rid,sid){if(S.raca===rid&&(!sid||S.sub===sid))return;applyChange(()=>{S.raca=rid;const r=raca();S.sub=sid||(r.subs.length===1?r.subs[0][0]:null);S.fichas=[];S.fmtEsc='21';delete S.d.subsug;delete S.d.nome;delete S.d.sobre;delete S.d.apel;if(!SOB_HUMANO.includes(rid)&&!NOMES2.S[rid]){S.sobrenome=''}if(rid!=='golias')S.apelido='';if(!sid&&raca().subs.length>1)revelar('#alvo-sub');else revelar('#alvo-classe')},'raca')}
DIE_FX.racasug=(v,k,auto)=>{const r=faixa(RACA_SUP,v)[2];delete S.d.exsug;
 if(r==='raro'){S.sugRaca=null;if(auto){let ve,e;do{ve=rnd(100);e=faixa(EXO,ve)}while(!e);S.d.exsug={v:ve};DIE_FX.exsug(ve)}return}
 S.sugRaca=r;escolheRaca(r)};
DIE_FX.exsug=v=>{const e=faixa(EXO,v);if(!e){S.sugRaca=null;return}const [rid,sid]=exoRef(e).split(':');S.sugRaca=rid;escolheRaca(rid,sid)};
DIE_FX.classesug=v=>{const c=faixa(CLASSE_SUP,v)[2];S.sugClasse=c;if(S.classe!==c)applyChange(()=>trocaClasse(c),'classe')};
const todosDeuses=()=>Object.values(DEUSES).join(', ').split(', ');
DIE_FX.subclsug=v=>{const l=SUBCL[S.classe];if(l)S.subcl=l[v-1]};
DIE_FX.deussug=v=>{S.deus=todosDeuses()[v-1]};
DIE_FX.subsug=v=>{const r=raca();if(!r)return;applyChange(()=>{S.sub=r.subs[v-1][0];S.fichas=[]},'raca')};
function trocaClasse(c){S.classe=c;S.subcl='';S.deus='';delete S.ok.deus;S.estiloCl='';delete S.d.subclsug;delete S.d.deussug;
 if(typeof S.perfil==='number'){if(ordemCl())aplicaPerfil();else{S.perfil=null;pb8()}}
 if(semOrdem()&&S.perfil!=='livre'){S.perfil='livre'}
 S.fichas=[]}

function faltando(n){const f=[];const c=S.classe;
  if(n===0){if(!S.modo)f.push('o tom da história');if(!S.caminho)f.push('como montar o personagem')}
  if(n===1){if(!S.raca)f.push('a raça');else if(!S.sub)f.push('a sub-raça');if(!c)f.push('a classe');
   if(c&&SUBCL[c]&&!S.subcl)f.push({clerigo:'o domínio divino',feiticeiro:'a origem da magia',bruxo:'o patrono'}[c]);
   if(c==='clerigo'&&!S.deus)f.push('a divindade');if(!S.antec)f.push('o antecedente')}
  if(n===2){if(!((S.patria&&S.assent)||S.regExtra))f.push(S.patria?'a cidade onde nasceu':'onde nasceu');if(S.idade==null)f.push(S.raca&&S.classe?'a idade':'a idade (escolha raça e classe antes)')}
  if(n===3&&!valida(3)){if(!S.classe)f.push('a classe');else if(ORDEM_CLASSE[S.classe]&&ORDEM_CLASSE[S.classe].length>1&&!S.estiloCl&&S.perfil!=='livre')f.push('como seu personagem luta');else if(S.perfil==null&&!semOrdem())f.push('um perfil');else if(pbGasto()>27)f.push('gastar no máximo 27 pontos');else f.push('os bônus da raça, cada um num atributo diferente')}
  if(n===4&&!valida(4))f.push('terminar a crônica: role ou escolha cada resultado, ou toque em “Rolar tudo que falta”');
  return f}
function valida(n){
  switch(n){
    case 0:return !!(S.modo&&S.caminho);
    case 1:{const c=S.classe;if(!(S.raca&&S.sub&&c&&S.antec))return false;if(SUBCL[c]&&!S.subcl)return false;return !(c==='clerigo'&&!S.deus)}
    case 2:return !!(((S.patria&&S.assent)||S.regExtra)&&S.idade!=null);
    case 3:{
      if(!(typeof S.perfil==='number'||S.perfil==='livre'||semOrdem()))return false;
      if(pbGasto()>27)return false;
      const t=fmtTokens();if(S.fichas.length!==t.length||S.fichas.some(f=>!f.a))return false;
      const as=S.fichas.map(f=>f.a);return new Set(as).size===as.length;
    }
    case 4:return crBuild().done;
    default:return true;
  }
}

const CR_INTRO=[[/^paisr?$/,'Comecemos pelo sangue: a sua família.'],[/^(nasc|press)/,'Agora, o dia em que você chegou ao mundo.'],[/^(irm|i\d)/,'Irmãos. Bênção ou praga, depende do dia.'],[/^(fam|aus_)/,'E quem criou você?'],[/^(est|lar|memo)/,'Como foi a sua infância?'],[/^res/,'E onde você vive hoje?'],[/^ponte/,'Hm. Isso não bate com o resto. Vamos explicar como aconteceu.'],[/^porque/,'Agora, as suas escolhas.'],[/^(nev|e\d)/,'Agora, o que a vida fez com você.'],[/^(dom|fq|fm|fs)/,'Por último, seus dons e fraquezas.']];
const crGrupo=k=>CR_INTRO.findIndex(([re])=>re.test(k));
const SEC_CR=[['origem','Origem'],['familia','Família'],['infancia','Infância'],['casa','Onde vive hoje'],['incomum','Uma origem incomum'],['decisoes','Escolhas'],['eventos','O que marcou sua vida'],['dons','Dons']];
function crChip(r){return `<button class="resp" type="button" data-act="crmudar" data-v="${esc(r.k)}">${esc(r.t||'')}</button>`}
function crOps(row,act,bind){const o=row.ops;if(!o||!o.length)return '';
 if(o.length<=6)return `<div class="grade um">${o.map(([v,l])=>`<button class="opt" type="button" data-act="${act}" data-v="${v}" aria-pressed="${act==='crset'&&row.v===v}">${esc(l)}</button>`).join('')}</div>`;
 return `<select id="${bind}" data-bind="${bind}" aria-label="Escolha"><option value="">Escolha</option>${o.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join('')}</select>`}
function telaCr(){
 const {rows,H,done}=crBuild();const last=rows[rows.length-1];
 const feitas=rows.filter(r=>r.v!=null);
 const ed=S.crEdit&&feitas.find(r=>r.k===S.crEdit);
 let hist='';
 if(feitas.length>3||done&&feitas.length)hist+=`<details class="todos"><summary>Ver todos os resultados (${feitas.length})</summary><div class="lista">${feitas.map(r=>`<div class="lin"><span>${esc(r.label)}</span>${crChip(r)}</div>`).join('')}</div></details>`;
 if(!done&&!ed)hist+=feitas.slice(-3).map(r=>`<div class="hist"><p class="frase">${esc(r.label)}</p>${crChip(r)}</div>`).join('');
 let at='';
 if(ed){
  at=`<p class="fala" id="fala">Quer mudar isto? ${esc(ed.label)}. Agora está: <b>${esc(ed.t||'')}</b>. O que depende deste resultado pode mudar ou pedir outra rolagem.</p>`+crOps(ed,'crset','credit')+
   `<div class="linha"><button class="btn sec" type="button" data-act="crreroll">Rolar de novo</button><button class="linkbtn" type="button" data-act="crcancel">Deixar como estava</button></div>`;
 }else if(!done&&last){
  const ult=feitas[feitas.length-1];
  const g=crGrupo(last.k),intro=g>=0&&(!ult||crGrupo(ult.k)!==g)?CR_INTRO[g][1]:'';
  const abre=!ult?'Agora, a sua vida antes da aventura. Os dados contam um pedaço por vez: role, escolha, ou role tudo de uma vez. ':'';
  at=`<p class="fala" id="fala">${abre}${ult?`Anotado: <b>${esc(ult.t||'')}</b>. `:''}${esc(intro)}</p>`;
  if(last.choice)at+=`<div class="atual">${last.choice}</div>`;
  else{const lab=(last.n>1?last.n:'')+'d'+last.s+(last.bonus?(last.bonus>0?'+'+last.bonus:String(last.bonus)):'');const st=S.d['cr:'+last.k]||{};
   at+=`<p class="pergunta">${esc(last.label)}</p>`+crOps(last,'crpick','crpick')+
   `<div class="dado"><div class="pedra" id="pedra-cr">${pedraSVG(null,lab)}</div><div class="dctl"><button class="btn sec dadob" type="button" data-act="crroll">Rolar</button><button class="btn sec dadob" type="button" data-act="crall">Rolar tudo que falta</button><button class="linkbtn" type="button" data-act="crmesa">rolei na mesa</button>
   ${st.mesa?`<div class="mesa"><input type="number" inputmode="numeric" min="${last.n}" max="${last.n*last.s}" placeholder="${last.n}–${last.n*last.s}" id="crmesa" aria-label="Valor que saiu no dado"><button class="btn sec" type="button" data-act="crmesaok">Usar</button></div>${st.err?`<p class="err">${esc(st.err)}</p>`:''}`:''}</div></div>`}
 }else{
  const n=nascInfo();
  at=`<p class="fala" id="fala">Essa é a sua vida até aqui. Leia com calma. Se algo não servir, abra os resultados e toque no que quer mudar.</p><div class="historia">${SEC_CR.filter(([k])=>H[k].length).map(([k,t])=>`<p><b>${t}.</b> ${H[k].map(esc).join(' ')}</p>`).join('')}</div>`;
  at+=`<label class="f" for="resman">Prefere escolher onde vive hoje?</label><select id="resman" data-bind="resman"><option value="">Deixar os dados decidirem</option>${n?`<option ${S.crSel.res===n.nome?'selected':''} value="${esc(n.nome)}">No mesmo lugar onde nasceu (${esc(n.nome)})</option>`:''}${Object.entries(ASSENT).map(([p,l])=>`<optgroup label="${esc(p)}">${l.map(x=>{const v=x[2]+', '+p;return `<option ${S.crSel.res===v?'selected':''} value="${esc(v)}">${esc(x[2])}</option>`}).join('')}</optgroup>`).join('')}<optgroup label="Outras regiões de Faerûn">${REG_EXTRA.map(x=>`<option ${S.crSel.res===x?'selected':''}>${esc(x)}</option>`).join('')}</optgroup></select>`;
 }
 if(feitas.length&&!ed)at+=`<div class="linha"><button class="linkbtn" type="button" data-act="crreset">Refazer a crônica inteira</button></div>`;
 return [hist,at,ed?'ed:'+ed.k:done?'fim':'cr:'+(last?last.k:'')]}

let ultimaChave='',primeira=true;
function render(){

 let hist='',atual='',chave;
 if(E===4){const [h,a,k]=telaCr();hist=h;atual=a;chave='4:'+k}
 else{
  const ordem=ETQ[E].filter(ativa);
  if(S.edit&&!ordem.includes(S.edit))S.edit=null;
  const cur=S.edit||ordem.find(q=>!Q[q].feito());
  if(S.pend&&S.pend.q!==cur)S.pend=null;
  const ate=cur?ordem.indexOf(cur):ordem.length;

  atual=cur?`<p class="fala" id="fala">${Q[cur].fala()}</p>${Q[cur].corpo()}${S.edit?`<div class="linha"><button class="linkbtn" type="button" data-act="canceledit">Deixar como estava</button></div>`:''}`:fimEtapa(E);
  chave=E+':'+(cur||'fim');
 }
 $('#historico').innerHTML=hist;$('#atual').innerHTML=atual;
 const f=$('#fala');
 if(f&&chave!==ultimaChave){f.classList.add('nova');requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.remove('nova')));
  if(!primeira){const at=$('#atual'),r=at.getBoundingClientRect();if(r.top<70||r.top>innerHeight*.55)scrollTo({top:Math.max(0,scrollY+r.top-110),behavior:reduz?'auto':'smooth'})}}
 ultimaChave=chave;primeira=false;

 salvaLogo();
}
function go(n){if(!podeIr(n))return;S.step=n;S.max=Math.max(S.max,n);S.edit=null;S.pend=null;S.crEdit=null;ultimaChave='';primeira=true;render();scrollTo({top:0,behavior:reduz?'auto':'smooth'});const c=$('#trilha [aria-current]');if(c)c.scrollIntoView({inline:'center',block:'nearest'})}

/* ---------- brasas e faíscas ---------- */
const cv=$('#brasas'),cx=cv.getContext('2d');let W=0,HH=0,brasas=[],faiscas=[];const dpr=()=>window.devicePixelRatio||1;
function tamanho(){W=cv.width=innerWidth*dpr();HH=cv.height=innerHeight*dpr();cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px'}
addEventListener('resize',tamanho);tamanho();
function novaBrasa(){return {x:Math.random()*W,y:HH+Math.random()*HH*.3,r:(.8+Math.random()*1.8)*dpr(),v:(.25+Math.random()*.7)*dpr(),f:Math.random()*6.3,a:.35+Math.random()*.5}}
for(let i=0;i<46;i++){const b=novaBrasa();b.y=Math.random()*HH;brasas.push(b)}
function faiscar(px,py,n=26){if(reduz)return;for(let i=0;i<n;i++){const ang=-Math.PI/2+(Math.random()-.5)*2.4,sp=(2+Math.random()*5)*dpr();faiscas.push({x:px*dpr(),y:py*dpr(),vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,vida:1})}}
function faiscaEm(el,n){if(!el||!el.getBoundingClientRect)return;const r=el.getBoundingClientRect();faiscar(r.left+r.width/2,r.top+r.height/2,n)}
function quadro(){cx.clearRect(0,0,W,HH);
 for(const b of brasas){b.y-=b.v;b.f+=.02;b.x+=Math.sin(b.f)*.4*dpr();if(b.y<-10)Object.assign(b,novaBrasa());
  const g=cx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*4);g.addColorStop(0,`rgba(255,150,70,${b.a})`);g.addColorStop(1,'rgba(255,90,20,0)');cx.fillStyle=g;cx.beginPath();cx.arc(b.x,b.y,b.r*4,0,7);cx.fill()}
 faiscas=faiscas.filter(f=>f.vida>0);
 for(const f of faiscas){f.x+=f.vx;f.y+=f.vy;f.vy+=.18*dpr();f.vida-=.025;cx.strokeStyle=`rgba(255,${170+60*f.vida|0},90,${f.vida})`;cx.lineWidth=1.6*dpr();cx.beginPath();cx.moveTo(f.x,f.y);cx.lineTo(f.x-f.vx*1.8,f.y-f.vy*1.8);cx.stroke()}
 requestAnimationFrame(quadro)}
if(!reduz)requestAnimationFrame(quadro);

 else if(a==='fmt'){S.fmtEsc=v;S.fichas=[];render()}
 else if(a==='perfil'){S.perfil=v==='livre'?'livre':+v;aplicaPerfil();if(v!=='livre')sugereFichas();else delete S.ok.pb;delete S.ok.bonus;S.cr={};S.crSel={};S.edit=null;render()}
 else if(a==='estilocl'){S.edit=null;if(S.estiloCl!==v){S.estiloCl=v;aplicaPerfil();sugereFichas();delete S.ok.bonus;S.cr={};S.crSel={}}render()}
 else if(a==='roll'){const k=b.dataset.key,n=+b.dataset.n,s=+b.dataset.s;const el=document.querySelector(`[data-die="${k}"] .pedra`);animaPedra(el,()=>rolaDado(k,n,s,true))}
 else if(a==='mesa'){const k=b.dataset.key;S.d[k]={...(S.d[k]||{}),mesa:true};render();const inp=document.querySelector(`[data-mesa="${k}"]`);if(inp)inp.focus()}
 else if(a==='mesaok'){const k=b.dataset.key;const inp=document.querySelector(`[data-mesa="${k}"]`);const n=+inp.dataset.n,s=+inp.dataset.s,x=Number(inp.value);
   if(!Number.isInteger(x)||x<n||x>n*s){S.d[k]={...(S.d[k]||{}),mesa:true,err:`Digite um número inteiro de ${n} a ${n*s}.`};render()}
   else{if(!DADO_NAO_RESPONDE.includes(k))S.edit=null;if(KEY_PER[k])delete S.perTxt[KEY_PER[k]];setDie(k,x)}}
 else if(a==='pb'){const k=b.dataset.k,d=+b.dataset.d,nv=S.pb[k]+d;if(nv<8||nv>15)return;const old=S.pb[k];S.pb[k]=nv;if(pbGasto()>27)S.pb[k]=old;S.cr={};S.crSel={};render()}
 else if(a==='ok'){
   if(v==='nome'&&!S.nome.trim())return;if(v==='pb'&&pbGasto()>27)return;if(v==='bonus'&&!bonusOk())return;
   S.ok[v]=1;S.edit=null;golpe();render()}
 else if(a==='idadeok'){const d=idadeDados(),x=Number($('#idade').value);const ok=d?(Number.isInteger(x)&&x>=d.min&&x<=d.max):(Number.isInteger(x)&&x>=1&&x<=2000);
   if(ok){S.idade=x;delete S.d.idade;S._idErr='';S.edit=null}else S._idErr=d?`Diga um número inteiro de ${d.min} a ${d.max}.`:'Diga um número inteiro de anos.';render()}
 else if(a==='crroll'){animaPedra($('#pedra-cr'),()=>{crRollOne();delete S.d.cr;render()})}
 else if(a==='crall'){golpe();crRollAll();render()}
 else if(a==='crmesa'){const {rows}=crBuild();const l=rows[rows.length-1];if(l)S.d['cr:'+l.k]={mesa:true};render();const i=$('#crmesa');if(i)i.focus()}
 else if(a==='crmesaok'){const {rows}=crBuild();const l=rows[rows.length-1];const x=Number($('#crmesa').value);
   if(!Number.isInteger(x)||x<l.n||x>l.n*l.s){S.d['cr:'+l.k]={mesa:true,err:`Digite um número inteiro de ${l.n} a ${l.n*l.s}.`}}
   else if(l.valid&&!l.valid(x)){S.d['cr:'+l.k]={mesa:true,err:'Esse número manda rolar de novo.'}}
   else{S.cr[l.k]=x;delete S.crMan[l.k];delete S.d['cr:'+l.k]}render()}
 else if(a==='crreset'){modal('Refazer a crônica inteira? Todas as rolagens desta etapa serão apagadas.',()=>{S.cr={};S.crSel={};S.crMan={};S.crEdit=null;Object.keys(S.d).filter(k=>k.startsWith('cr:')).forEach(k=>delete S.d[k]);render()},'Refazer','perigo')}
 else if(a==='crmudar'){S.crEdit=v;render()}
 else if(a==='crcancel'){S.crEdit=null;render()}
 else if(a==='crset'){crAplica(+v,true)}
 else if(a==='crreroll'){const row=crBuild().rows.find(r=>r.k===S.crEdit);if(row){let x,g=0;do{x=rollN(row.n,row.s);g++}while(row.valid&&!row.valid(x)&&g<500);crAplica(x,false)}}
 else if(a==='crpick'){const {rows}=crBuild();const l=rows[rows.length-1];if(l&&!l.choice&&l.v==null){S.cr[l.k]=+v;S.crMan[l.k]=1;delete S.d['cr:'+l.k]}render()}
 else if(a==='crsel'){const [k,val]=v.split(':');S.crSel[k]=k.startsWith('fs')?+val:val;render()}
 else if(a==='perpick'){const c=b.dataset.campo;S.per[c]=+v;delete S.perTxt[c];delete S.d[PER_KEY[c]];S.edit=null;render()}
 else if(a==='pertxtok'){const c=b.dataset.campo;if(!(S.perTxt[c]||'').trim()){const i=$('#pt-'+c);if(i)i.focus();return}S.ok['p'+c]=1;S.edit=null;render()}
 else if(a==='perall'){golpe();const set=(k,n,sd)=>{const x=rollN(n,sd);S.d[k]={v:x};DIE_FX[k](x,k,true)};
   if(!perFeito('t1'))set('pt1',1,8);if(!perFeito('t2'))set('pt2',1,8);if(!perFeito('i'))set('pid',1,6);if(!perFeito('b'))set('pvi',1,6);if(!perFeito('f'))set('pdf',1,6);
   const A=altTab();if(A){if(S.apar.h==null)set('alt',A[1],A[2]);if(A[5]!==0&&S.apar.w==null)set('peso',A[4],A[5])}if(!S.apar.m&&!okd('marca'))set('marca',1,12);S.edit=null;render()}
 else if(a==='medir'){const A=altTab();if(!A)return;animaPedra(document.querySelector('[data-die="alt"]'),()=>{let x=rollN(A[1],A[2]);S.d.alt={v:x};DIE_FX.alt(x);if(A[5]!==0){x=rollN(A[4],A[5]);S.d.peso={v:x};DIE_FX.peso(x)}S.edit=null;render()})}
 else if(a==='marca'){const x=+v;if(x)S.apar.m=x;else delete S.apar.m;delete S.d.marca;S.ok.marca=1;S.edit=null;render()}
 else if(a==='copiar'){const t=fichaTexto();const done=()=>{const c=$('#copied');if(c)c.textContent='Texto copiado.'};
   try{navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done))}catch(_){fallbackCopy(t,done)}}
 else if(a==='imprimir'){try{window.print()}catch(_){}}
 else if(a==='histreset'){S.histEdit=null;S.histBase='';render()}
 else if(a==='enviar'){if(!S.enviando)enviarFicha()}
});
function fallbackCopy(t,done){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(_){}ta.remove()}

document.addEventListener('input',e=>{
 const t=e.target;salvaLogo();
 if(t.dataset.ap){S.apar[t.dataset.ap]=t.value;return}
 if(t.dataset.pertxt){S.perTxt[t.dataset.pertxt]=t.value;delete S.ok['p'+t.dataset.pertxt];return}
 if(t.dataset.livre==='extra'){S.extra=t.value;atualizaFicha();return}
 if(t.dataset.livre==='historia'){if(S.histEdit==null)S.histBase=histGerada();S.histEdit=t.value;atualizaFicha();return}
 if(t.dataset.env){S.env[t.dataset.env]=t.value;S.envErro='';return}
 if(['nome','sobrenome','apelido'].includes(t.dataset.bind)){S[t.dataset.bind]=t.value;const bt=document.querySelector(`[data-okfor="${t.dataset.bind}"]`);
  if(bt){const tem=!!t.value.trim();if(t.dataset.bind==='nome')bt.disabled=!tem;else if(t.dataset.bind==='apelido')bt.textContent=tem?'Fica esse':'Seguir sem apelido';else{const x=listaSob();bt.textContent=tem?'Fica esse':'Seguir sem '+lower(x?x.l:'sobrenome')}}}
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!e.target.matches('input'))return;const t=e.target;
 if(t.id==='idade'){e.preventDefault();const b=document.querySelector('[data-act="idadeok"]');if(b)b.click()}
 else if(t.dataset.bind){const b=document.querySelector(`[data-okfor="${t.dataset.bind}"]`);if(b&&!b.disabled){e.preventDefault();b.click()}}
 else if(t.dataset.pertxt){e.preventDefault();const b=document.querySelector(`[data-act="pertxtok"]`);if(b)b.click()}});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.bind==='regExtra'){S.regExtra=t.value;S.notaOrigem='';if(t.value)S.edit=null;if(Object.keys(S.cr).length)S.cr={};render()}
 else if(t.dataset.bind==='assent'){if(!t.value)return;S.assent=t.value;S.notaOrigem='';delete S.d.assent;if(Object.keys(S.cr).length||Object.keys(S.per).length){S.cr={};S.crSel={};S.per={};['pt1','pt2','pid','pvi','pdf'].forEach(k=>delete S.d[k])}S.edit=null;render()}
 else if(t.dataset.bind==='estilo'){S.estilo=t.value;delete S.d.nome;delete S.d.sobre;render()}
 else if(t.dataset.bind==='antec'){if(!t.value)return;S.antec=t.value;delete S.d.antec;S.cr={};S.crSel={};S.per={};S.edit=null;render()}
 else if(t.dataset.bind==='credit'){if(t.value)crAplica(+t.value,true)}
 else if(t.dataset.bind==='crpick'){if(t.value){const {rows}=crBuild();const l=rows[rows.length-1];if(l&&!l.choice&&l.v==null){S.cr[l.k]=+t.value;S.crMan[l.k]=1;delete S.d['cr:'+l.k]}}render()}
 else if(t.dataset.bind==='resman'){if(t.value)S.crSel.res=t.value;else delete S.crSel.res;render()}
 else if(t.dataset.bind==='deus'){if(!t.value)return;S.deus=t.value;delete S.d.deussug;S.edit=null;render()}
 else if(t.dataset.ficha){S.fichas[+t.dataset.ficha].a=t.value;S.cr={};S.crSel={};render()}
});

$('#voltar').onclick=()=>{if(S.step>0)go(S.step-1)};
$('#reset').onclick=()=>modal('Apagar tudo o que foi feito e voltar ao início?',()=>{
 apagaRasc();Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,JSON.parse(S0));go(0);
},'Apagar tudo','perigo');
$('#avancar').onclick=e=>{if(!completa(S.step)||S.step>=ETAPAS.length-1)return;faiscaEm(e.currentTarget,18);golpe();go(S.step+1)};
render();
abertura();
</script>
</body>
</html>
