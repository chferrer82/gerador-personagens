<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de Personagens — Forgotten Realms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;0,800;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDF1; --surface:#F6F8FA; --ink:#14283A; --muted:#4E6272; --line:#B8C4CE;
  --brass:#8A6A12; --brass-soft:#E9DDB6; --madder:#9E3450; --ok:#2F6B4F;
  --serif:"Alegreya", Georgia, "Times New Roman", serif;
  --sans:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F2233; --surface:#16304A; --ink:#EAE3D2; --muted:#9FB0BE; --line:#2C4A66;
    --brass:#D4AF37; --brass-soft:#3A3620; --madder:#D96A84; --ok:#6FC39A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F2233; --surface:#16304A; --ink:#EAE3D2; --muted:#9FB0BE; --line:#2C4A66;
  --brass:#D4AF37; --brass-soft:#3A3620; --madder:#D96A84; --ok:#6FC39A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
#scroller{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 24px}
header.top{padding:20px 0 8px}
header.top h1{font-family:var(--serif);font-weight:800;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.1;margin:0}
header.top p{margin:4px 0 0;color:var(--muted)}
nav.rail{display:flex;gap:6px;overflow-x:auto;padding:12px 0 14px;scrollbar-width:thin}
nav.rail button{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);font:500 .9rem var(--sans);padding:6px 10px;border-radius:999px;cursor:pointer}
nav.rail button[aria-current="step"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.rail button.done{color:var(--ink);border-color:var(--brass)}
nav.rail button:disabled{opacity:.4;cursor:default}
main section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px}
h2{font-family:var(--serif);font-weight:800;font-size:1.6rem;line-height:1.15;margin:0 0 6px}
h3{font-family:var(--serif);font-weight:600;font-size:1.2rem;margin:22px 0 8px}
p.lead{color:var(--muted);margin:0 0 14px;max-width:62ch}
.hint{color:var(--muted);font-size:.93rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid.cmp{grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.grid.cmp .opt{padding:8px 9px;font-size:.95rem;line-height:1.25}
.grid.cmp .opt[aria-pressed="true"]{padding:7px 8px}
.grid.cmp .opt small{font-size:.78rem}
.opt{display:block;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:500 1rem var(--sans);cursor:pointer;position:relative}
.opt small{display:block;color:var(--muted);font-weight:400;font-size:.85rem}
.opt[aria-pressed="true"]{border:2px solid var(--brass);background:var(--brass-soft);padding:9px 11px}
.opt .sug{position:absolute;top:6px;right:8px;font-size:.75rem;color:var(--brass);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:block;font-weight:500;margin:14px 0 4px}
input[type=text],input[type=number],select,textarea{width:100%;font:1rem var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
textarea{min-height:110px;resize:vertical}
button.btn{font:700 1rem var(--sans);border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
button.btn.sec{background:transparent;color:var(--ink)}
button.btn:disabled{opacity:.4;cursor:default}
button.btn.ghost{background:transparent;border-color:transparent;color:var(--madder);font-weight:600;padding:10px 8px}
button.btn.danger{background:var(--madder);border-color:var(--madder);color:#fff}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

/* Dado */
.die{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border:1px dashed var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--bg)}
.die svg{width:74px;height:74px}
.die .face{fill:none;stroke:var(--brass);stroke-width:3}
.die .num{font-family:var(--serif);font-weight:800;fill:var(--ink)}
.die .dt{font-family:var(--sans);font-weight:700;fill:var(--muted)}
.die .what{font-weight:700}
.die .res{font-family:var(--serif);font-size:1.05rem;margin-top:2px}
.die .ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.die .ctl button{font:600 .92rem var(--sans);padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.die .ctl button.linkbtn{border:none;background:none;color:var(--muted);text-decoration:underline;font-weight:500;padding:7px 4px}
.die .mesa{display:flex;gap:6px;align-items:center;margin-top:8px}
.die .mesa input{width:90px}
.err{color:var(--madder);font-size:.9rem}
.drop{text-decoration:line-through;opacity:.45}

/* Atributos */
table.at{width:100%;border-collapse:collapse;margin-top:8px;font-size:.95rem}
table.at th,table.at td{border-bottom:1px solid var(--line);padding:8px 4px;text-align:left;vertical-align:top}
table.at td.n{font-family:var(--serif);font-weight:800;font-size:1.15rem;white-space:nowrap}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:4px}
.tag.dom{background:var(--brass-soft);color:var(--brass)}
.tag.fr{border:1px solid var(--madder);color:var(--madder)}
.scroll{overflow-x:auto}
.pb{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 10px;align-items:center}
.pb button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 1.1rem var(--sans);cursor:pointer}
.wip{border-left:4px solid var(--brass);padding:10px 14px;background:var(--bg);border-radius:0 10px 10px 0}
#painel{max-width:680px;margin:0 auto 8px;max-height:24vh;overflow-y:auto;padding:8px 12px}
#painel p{font-size:.95rem;line-height:1.45}
#painel[hidden]{display:none}
.ranz{margin:14px 0 4px;padding:12px 14px;border-left:4px solid var(--brass);background:var(--bg);border-radius:0 10px 10px 0}
.ranz .quem{font:700 .9rem var(--sans);color:var(--brass)}
.ranz p{margin:0;font-family:var(--serif);font-style:italic;font-size:1.05rem;line-height:1.55;max-width:62ch}
pre.ficha{white-space:pre-wrap;font-family:var(--serif);font-size:1rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px}

/* Barra inferior */
footer.bar{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px}
footer.bar .in{max-width:680px;margin:0 auto;display:flex;justify-content:space-between;gap:10px}
@media (max-width:420px){footer.bar{padding:10px 10px}footer.bar .in{gap:6px}footer.bar button.btn{padding:10px 12px;font-size:.95rem}footer.bar button.btn.ghost{padding:10px 4px}}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,20,30,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:440px;padding:20px}
.modal .box p{margin:0 0 14px}

@media (prefers-reduced-motion:no-preference){
  .die svg.roll{animation:spin .45s ease-out}
  @keyframes spin{from{transform:rotate(-120deg) scale(.7)}to{transform:none}}
}
@media print{
  nav.rail,footer.bar,header.top p,.noprint{display:none!important}
  html,body{height:auto;overflow:visible;display:block}
  #scroller{overflow:visible}
  body{background:#fff;color:#000}
  main section{border:none;padding:0}
}
</style>
</head>
<body>
<div id="scroller"><div class="wrap">
  <header class="top">
    <h1>Crie seu personagem</h1>
    <p>Forgotten Realms, ano 1490 DR · passo a passo</p>
  </header>
  <nav class="rail" id="rail" aria-label="Etapas"></nav>
  <main id="app"></main>
</div></div>
<footer class="bar noprint"><div id="painel" class="ranz" aria-live="polite" hidden></div><div class="in">
  <button class="btn sec" id="back">Voltar</button>
  <button class="btn ghost" id="reset">Recomeçar</button>
  <button class="btn" id="next">Continuar</button>
</div></footer>
<div id="modal"></div>

<script>
/* =========================================================
   DADOS
   Fontes: PROJETO.md.
   ========================================================= */
// Tabelas carregadas do banco SQLite pelo servidor (Flask). Para editar, veja gerenciar.py.
const __D=/*__DADOS__*/null;
const {ATR,PATRIA,ASSENT,REG_EXTRA,ANTEC,RACAS,FMT,EXO,IDADE_EXO,RACA_SUP,CLASSES,CLASSE_SUP,SUBCL,DEUSES,IDADE,PB_CUSTO,PERFIS,ORDEM_CLASSE,ARRAY,FAIXAS,ESCALA,VAGA,DESC,DESC_CL,NOMES,NOMES2,ESTILO_LUGAR,SOB_HUMANO}=__D;
const exoRef=e=>e[4]||('x_'+e[3].toLowerCase().replace(/[^a-z]/g,''));
EXO.filter(e=>!e[4]).forEach(e=>RACAS.push({id:exoRef(e),n:e[2],en:e[3],idade:null,idx:IDADE_EXO[e[3]],rara:true,subs:[['u','—','mm']]}));

const ETAPAS=['Tom','Quem é você','De onde vem','Atributos','Crônica','Personalidade e ficha'];

/* =========================================================
   ESTADO
   ========================================================= */
const S={step:0,max:0,d:{},modo:null,caminho:null,ideia:'',vaga:{},
 patria:null,assent:null,regExtra:'',mora:'mesmo',patria2:null,assent2:null,regExtra2:'',antec:null,
 raca:null,sub:null,nome:'',gen:'m',estilo:'',sobrenome:'',apelido:'',
 classe:null,subcl:'',deus:'',idade:null,
 perfil:null,estiloCl:'',pb:{FOR:8,DES:8,CON:8,INT:8,SAB:8,CAR:8},fichas:[],fmtEsc:'21',sugRaca:null,sugClasse:null,cr:{},crSel:{},per:{},apar:{},_res:'',notaOrigem:'',env:{jogador:'',email:''},enviado:null,envErro:'',enviando:false};

const S0=JSON.stringify(S);

/* =========================================================
   UTILITÁRIOS
   ========================================================= */
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rnd(s){const a=new Uint32Array(1);crypto.getRandomValues(a);return 1+(a[0]%s)}
function rollN(n,s){let t=0;for(let i=0;i<n;i++)t+=rnd(s);return t}
function faixa(tab,v){return tab.find(r=>v>=r[0]&&v<=r[1])}
const mod=v=>Math.floor((v-10)/2);
const fmtMod=m=>(m>=0?'+':'')+m;
const raca=()=>RACAS.find(r=>r.id===S.raca);
const sub=()=>{const r=raca();return r?r.subs.find(s=>s[0]===S.sub):null};
const classe=()=>CLASSES.find(c=>c.id===S.classe);
function idadeTab(){const r=raca(),s=sub();if(!r)return null;if(r.idx)return {...IDADE[r.idx[1]],a:r.idx[0]};return IDADE[(s&&s[3])||r.idade]}
function idadeDados(){const t=idadeTab(),c=classe();if(!t||!c)return null;const [n,s]=t[c.g];return {a:t.a,n,s,min:t.a+n,max:t.a+n*s}}


/* =========================================================
   COMPONENTE DE DADO
   ========================================================= */
function dieSVG(val,label){
  return `<svg viewBox="0 0 80 80" aria-hidden="true"><polygon class="face" points="40,4 72,22 72,58 40,76 8,58 8,22"/>
  <text class="num" x="40" y="${val!=null?47:45}" text-anchor="middle" font-size="${val!=null&&String(val).length>2?20:26}">${val!=null?val:'?'}</text>
  <text class="dt" x="40" y="66" text-anchor="middle" font-size="11">${label}</text></svg>`;
}
/* key: identificador; n,s: dados; what: rótulo; show: texto do resultado */
function die(key,n,s,what,show){
  const st=S.d[key]||{};const label=(n>1?n:'')+'d'+s;
  return `<div class="die" data-die="${key}">
    <div>${dieSVG(st.v,label)}</div>
    <div><div class="what">${esc(what)}</div>
      <div class="res">${st.v!=null?show(st.v):'<span class="hint">Ainda não rolado</span>'}</div>${st.nota?`<div class="hint">${esc(st.nota)}</div>`:''}
      <div class="ctl noprint">
        <button data-act="roll" data-key="${key}" data-n="${n}" data-s="${s}">Rolar aqui</button>
        <button class="linkbtn" data-act="mesa" data-key="${key}">rolei na mesa</button>
      </div>
      ${st.mesa?`<div class="mesa noprint"><input type="number" inputmode="numeric" min="${n}" max="${n*s}" placeholder="${n}–${n*s}" data-mesa="${key}" data-n="${n}" data-s="${s}"><button class="btn sec" data-act="mesaok" data-key="${key}">Usar</button></div>
      ${st.err?`<div class="err">${esc(st.err)}</div>`:''}`:''}
    </div></div>`;
}
const DIE_FX={}; // efeito ao definir resultado
function setDie(key,v,auto){
 if(['patria','assent','antec'].includes(key)&&(Object.keys(S.cr).length||Object.keys(S.per).length)){S.cr={};S.crSel={};S.per={};['pt1','pt2','pid','pvi','pdf'].forEach(k=>delete S.d[k])}
 S.d[key]={v};(DIE_FX[key.split(':')[0]]||(()=>{}))(v,key,auto);render(true)}

DIE_FX.patria=v=>{S.patria=faixa(PATRIA,v)[2];S.assent=null;delete S.d.assent;S.regExtra='';S.notaOrigem=''};
DIE_FX.assent=v=>{S.assent=faixa(ASSENT[S.patria],v)[2];S.notaOrigem=''};
DIE_FX.patria2=v=>{S.patria2=faixa(PATRIA,v)[2];S.assent2=null;delete S.d.assent2;S.regExtra2=''};
DIE_FX.assent2=v=>{S.assent2=faixa(ASSENT[S.patria2],v)[2]};
DIE_FX.antec=v=>{S.antec=faixa(ANTEC,v)[2]};
function lugarOrigem(){if(S.regExtra)return S.regExtra.includes(' — ')?S.regExtra.split(' — ')[1]:S.regExtra;return S.assent||''}
function estiloAuto(){return ESTILO_LUGAR[lugarOrigem()]||'tethyriano'}
function estilo(){return S.estilo||estiloAuto()}
function listaNome(){const r=raca();if(!r)return null;return r.id==='humano'?NOMES2.H[estilo()]:NOMES[r.id]}
function listaSob(){const r=raca();if(!r)return null;if(SOB_HUMANO.includes(r.id))return {l:'Sobrenome',s:NOMES2.H[estilo()].s};const x=NOMES2.S[r.id];return x?{l:r.id==='anao'||r.id==='gnomo'||r.id==='draconato'||r.id==='golias'?'Clã':r.id==='elfo'?'Família':'Sobrenome',s:x.s}:null}
function nomeCompleto(){const r=raca(),n=S.nome.trim(),sb=S.sobrenome.trim(),ap=S.apelido.trim();if(!n)return '';
 if(r&&r.id==='draconato')return (sb?sb+' ':'')+n;
 if(r&&r.id==='golias')return n+(ap?' “'+ap+'”':'')+(sb?' '+sb:'');
 return n+(sb?' '+sb:'')}
function blocoNome(){
 const r=raca();const l=listaNome();const sob=listaSob();
 let h=`<h3 id="alvo-nome">Nome</h3>`;
 if(r&&SOB_HUMANO.includes(r.id)){
  const auto=NOMES2.H[estiloAuto()].l.split(' — ')[0];
  h+=`<label class="f" for="estilo">Estilo ${r.id==='humano'?'do nome':'do sobrenome'}</label><select id="estilo" data-bind="estilo"><option value="">Da sua terra natal (${esc(auto)})</option>${Object.entries(NOMES2.H).map(([k,v])=>`<option value="${k}" ${S.estilo===k?'selected':''}>${esc(v.l)}</option>`).join('')}</select>`;
 }
 if(l){
  h+=`<div class="grid cmp" style="grid-template-columns:repeat(2,1fr);margin-top:10px">${opt('gen','m','Masculino','',S.gen==='m')}${opt('gen','f','Feminino','',S.gen==='f')}</div>`;
  h+=die('nome',1,12,`Nome ${S.gen==='m'?'masculino':'feminino'}`,v=>`${v} → <b>${esc(l[S.gen][v-1])}</b>`);
 }else h+=`<p class="hint">Escolha a raça para sortear um nome.</p>`;
 h+=`<label class="f" for="nome">${l?'Ou escreva o nome':'Nome'}</label><input type="text" id="nome" data-bind="nome" value="${esc(S.nome)}" placeholder="Nome do personagem">`;
 if(r&&r.id==='golias'){
  h+=die('apel',1,12,'Apelido',v=>`${v} → <b>${esc(NOMES2.A[v-1])}</b>`);
  h+=`<label class="f" for="apelido">Ou escreva o apelido</label><input type="text" id="apelido" data-bind="apelido" value="${esc(S.apelido)}">`;
 }
 if(sob){
  h+=die('sobre',1,12,sob.l+(r.id==='draconato'?' (vem antes do nome)':''),v=>`${v} → <b>${esc(sob.s[v-1])}</b>`);
  h+=`<label class="f" for="sobrenome">Ou escreva ${sob.l==='Clã'?'o clã':sob.l==='Família'?'a família':'o sobrenome'}</label><input type="text" id="sobrenome" data-bind="sobrenome" value="${esc(S.sobrenome)}">`;
 }else if(r)h+=`<p class="hint">Este povo não costuma usar sobrenome.</p>`;
 const nc=nomeCompleto();
 if(nc)h+=`<p style="margin-top:12px">Nome completo: <b id="nc">${esc(nc)}</b></p>`;
 return h;
}
function revelar(sel){requestAnimationFrame(()=>{const el=document.querySelector(sel);if(!el)return;const sc=$('#scroller');const r=el.getBoundingClientRect(),rs=sc.getBoundingClientRect();if(r.top<rs.top||r.bottom>rs.bottom-60){const red=matchMedia('(prefers-reduced-motion: reduce)').matches;el.scrollIntoView({behavior:red?'auto':'smooth',block:'start'})}})}
function escolheRaca(rid,sid){if(S.raca===rid&&(!sid||S.sub===sid))return;applyChange(()=>{S.raca=rid;const r=raca();S.sub=sid||(r.subs.length===1?r.subs[0][0]:null);S.fichas=[];S.fmtEsc='21';delete S.d.subsug;delete S.d.nome;delete S.d.sobre;delete S.d.apel;if(!SOB_HUMANO.includes(rid)&&!NOMES2.S[rid]){S.sobrenome=''}if(rid!=='golias')S.apelido='';if(!sid&&raca().subs.length>1)revelar('#alvo-sub');else revelar('#alvo-classe')},'raca')}
DIE_FX.racasug=(v,k,auto)=>{const r=faixa(RACA_SUP,v)[2];delete S.d.exsug;
 if(r==='raro'){S.sugRaca=null;if(auto){let ve,e;do{ve=rnd(100);e=faixa(EXO,ve)}while(!e);S.d.exsug={v:ve};DIE_FX.exsug(ve)}return}
 S.sugRaca=r;escolheRaca(r)};
DIE_FX.exsug=v=>{const e=faixa(EXO,v);if(!e){S.sugRaca=null;return}const [rid,sid]=exoRef(e).split(':');S.sugRaca=rid;escolheRaca(rid,sid)};
DIE_FX.classesug=v=>{const c=faixa(CLASSE_SUP,v)[2];S.sugClasse=c;if(S.classe!==c)applyChange(()=>trocaClasse(c),'classe')};
DIE_FX.subsug=v=>{const r=raca();if(!r)return;applyChange(()=>{S.sub=r.subs[v-1][0];S.fichas=[]},'raca')};
function trocaClasse(c){S.classe=c;S.subcl='';S.deus='';S.estiloCl='';
 if(typeof S.perfil==='number'){if(ordemCl())aplicaPerfil();else{S.perfil=null;pb8()}}
 if(semOrdem()&&S.perfil!=='livre'){S.perfil='livre'}
 S.fichas=[]}
DIE_FX.nome=v=>{const l=listaNome();if(l)S.nome=l[S.gen][v-1]};
DIE_FX.sobre=v=>{const x=listaSob();if(x)S.sobrenome=x.s[v-1]};
DIE_FX.apel=v=>{S.apelido=NOMES2.A[v-1]};
DIE_FX.idade=v=>{const d=idadeDados();if(d)S.idade=d.a+v};

/* =========================================================
   DEPENDÊNCIAS (voltar e mudar)
   ========================================================= */
const DEPS={
 raca:{lbl:['Idade','Fichas raciais (Atributos)','Crônica','Altura e peso'],test:()=>S.idade!=null||S.fichas.length||Object.keys(S.cr).length,clear:()=>{S.idade=null;delete S.d.idade;S.fichas=[];S.cr={};S.crSel={};S.apar.h=null;S.apar.w=null;delete S.d.alt;delete S.d.peso}},

function modal(html,ok,lbl,cls){
  $('#modal').innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="box"><p>${html}</p><div class="row"><button class="btn ${cls||''}" id="mok">${lbl||'Continuar'}</button><button class="btn sec" id="mno">Cancelar</button></div></div></div>`;

/* =========================================================
   ATRIBUTOS — cálculo
   ========================================================= */
function base(k){return S.pb[k]}
function bonus(k){return S.fichas.reduce((t,f)=>t+(f.a===k?f.v:0),0)}
function final(k){const b=base(k);return b==null?null:Math.min(20,b+bonus(k))}
function fmtTokens(){const s=sub();if(!s)return [];if(s[2]==='mm')return S.fmtEsc==='111'?[1,1,1]:[2,1];return FMT[s[2]]}
function pbGasto(){return ATR.reduce((t,[k])=>t+PB_CUSTO[S.pb[k]],0)}
function escala(k,v){const i=FAIXAS.findIndex(([a,b])=>v>=a&&v<=b);return i<0?'':ESCALA[k][i]}

/* =========================================================
   VALIDAÇÃO DAS ETAPAS
   ========================================================= */
function valida(n){
  switch(n){
    case 0:return !!(S.modo&&S.caminho);
    case 1:{const c=S.classe;if(!(S.raca&&S.sub&&c&&S.antec))return false;if(SUBCL[c]&&!S.subcl)return false;return !(c==='clerigo'&&!S.deus)}
    case 2:return !!(((S.patria&&S.assent)||S.regExtra)&&S.idade!=null);
    case 3:{
      if(!(typeof S.perfil==='number'||S.perfil==='livre'||semOrdem()))return false;
      if(pbGasto()>27)return false;
      const t=fmtTokens();if(S.fichas.length!==t.length||S.fichas.some(f=>!f.a))return false;
      const as=S.fichas.map(f=>f.a);return new Set(as).size===as.length;
    }
    case 4:return crBuild().done;
    default:return true;
  }
}

function crRollAll(){let g=0;while(g<600&&crRollOne())g++}
function crDie(row){const lab=(row.n>1?row.n:'')+'d'+row.s+(row.bonus?(row.bonus>0?' +'+row.bonus:' '+row.bonus):'');const st=S.d['cr:'+row.k]||{};
 return `<div class="die" data-die="cr"><div>${dieSVG(null,lab)}</div><div><div class="what">${esc(row.label)}</div>
 <div class="ctl noprint"><button data-act="crroll">Rolar aqui</button><button data-act="crall">Rolar tudo que falta</button><button class="linkbtn" data-act="crmesa">rolei na mesa</button></div>
 ${st.mesa?`<div class="mesa noprint"><input type="number" inputmode="numeric" min="${row.n}" max="${row.n*row.s}" placeholder="${row.n}–${row.n*row.s}" id="crmesa"><button class="btn sec" data-act="crmesaok">Usar</button></div>${st.err?`<div class="err">${esc(st.err)}</div>`:''}`:''}</div></div>`}
function telaCronica(){
 const {rows,H,done}=crBuild();const last=rows[rows.length-1];
 let h=`<h2>Crônica de origem</h2><p class="lead">Família, infância, o caminho até o antecedente e a classe, e o que marcou sua vida. Role um dado por vez ou tudo de uma vez.</p>`;
 const ult=rows.filter(r=>r.v!=null).pop();
 if(!done&&last){h+=last.choice?`<div class="die" style="display:block">${last.choice}</div>`:crDie(last);if(ult)h+=`<p class="hint">Última rolagem: ${esc(ult.label)} → <b>${ult.v+(ult.bonus||0)}</b>${ult.t?' ('+esc(ult.t)+')':''}</p>`}
 else h+=`<p class="wip">Sua crônica está completa.</p>`;
 const sec=[['origem','Origem'],['familia','Família'],['infancia','Infância'],['casa','Onde vive hoje'],['incomum','Uma origem incomum'],['decisoes','Escolhas'],['eventos','O que marcou sua vida'],['dons','Dons']];
 h+=`<h3>Sua história</h3>`;
 sec.forEach(([k,t])=>{if(H[k].length)h+=`<p><b>${t}.</b> ${H[k].map(esc).join(' ')}</p>`});
 const n=nascInfo();
 h+=`<label class="f" for="resman">Prefere escolher onde vive hoje?</label><select id="resman" data-bind="resman"><option value="">Deixar os dados decidirem</option>${n?`<option ${S.crSel.res===n.nome?'selected':''} value="${esc(n.nome)}">No mesmo lugar onde nasceu (${esc(n.nome)})</option>`:''}${Object.entries(ASSENT).map(([p,l])=>`<optgroup label="${esc(p)}">${l.map(x=>{const v=x[2]+', '+p;return `<option ${S.crSel.res===v?'selected':''} value="${esc(v)}">${esc(x[2])}</option>`}).join('')}</optgroup>`).join('')}<optgroup label="Outras regiões de Faerûn">${REG_EXTRA.map(x=>`<option ${S.crSel.res===x?'selected':''}>${esc(x)}</option>`).join('')}</optgroup></select>`;
 const feitas=rows.filter(r=>r.v!=null);
 if(feitas.length)h+=`<details style="margin-top:14px"><summary>Ver todas as rolagens (${feitas.length})</summary><table class="at"><tbody>${feitas.map(r=>`<tr><td>${esc(r.label)}</td><td class="n">${r.v+(r.bonus||0)}</td><td>${esc(r.t||'')}</td></tr>`).join('')}</tbody></table></details>`;
 h+=`<div class="row noprint" style="margin-top:14px"><button class="btn sec" data-act="crreset">Refazer a crônica</button></div>`;
 return h;
}
function cronicaTexto(){const {H}=crBuild();const out=[];[['origem','Origem'],['familia','Família'],['infancia','Infância'],['casa','Onde vive hoje'],['incomum','Uma origem incomum'],['decisoes','Escolhas'],['eventos','O que marcou sua vida'],['dons','Dons']].forEach(([k,t])=>{if(H[k].length)out.push(t+': '+H[k].join(' '))});return out}

/* =========================================================
   PERSONALIDADE E APARÊNCIA
   ========================================================= */
function perTab(){const k=(CR.BGKEY[bgNome()]||[])[1];return k?{k,t:CR.PER[k]}:null}
function altTab(){return CR.ALT[S.raca+':'+S.sub]||CR.ALT[S.raca]}
function medidas(){const A=altTab();if(!A||S.apar.h==null)return null;const hIn=A[0]+S.apar.h;const mult=A[5]===0?A[4]:S.apar.w;if(mult==null)return {cm:Math.round(hIn*2.54)};return {cm:Math.round(hIn*2.54),kg:Math.round((A[3]+S.apar.h*mult)*0.4536)}}
function telaPersona(){
 const P=perTab();let h=`<h2>Personalidade e aparência</h2>`;
 if(!P)return h+`<p class="hint">Escolha o antecedente na etapa Quem é você.</p>`;
 const T=P.t;const nomeTab=CR.PER_NOME[P.k];
 h+=`<p class="lead">Dois traços, um ideal, um vínculo e um defeito. ${bgNome()!==nomeTab?`Seu antecedente usa as tabelas de ${esc(nomeTab.toLowerCase())}.`:''}</p>`;
 const bloco=(key,n,lista,titulo,campo)=>{let x=die(key,1,n,titulo,v=>`${v} → <b>${esc(itTxt(lista[LI(lista,v)-1]))}</b>`);
  x+=`<select data-bind="per" data-campo="${campo}" data-key="${key}" aria-label="${esc(titulo)}"><option value="">Ou escolha</option>${lista.map((t,j)=>(leve()&&itP(t))?'':`<option value="${j+1}" ${S.per[campo]===j+1?'selected':''}>${esc(itTxt(t))}</option>`).join('')}</select>`;return x};
 h+=`<div class="row noprint"><button class="btn sec" data-act="perall">Rolar tudo o que falta</button></div>`;
 h+=`<h3>Traços de personalidade</h3>`+bloco('pt1',8,T.t,'Traço 1','t1')+bloco('pt2',8,T.t,'Traço 2','t2');
 if(S.per.t1&&S.per.t1===S.per.t2)h+=`<p class="err">Os dois traços são iguais. Escolha ou role outro.</p>`;
 h+=`<h3>Ideal</h3>`+bloco('pid',6,T.i,'Ideal','i')+`<h3>Vínculo</h3>`+bloco('pvi',6,T.b,'Vínculo','b')+`<h3>Defeito</h3>`+bloco('pdf',6,T.f,'Defeito','f');
 const A=altTab();
 h+=`<h3>Altura e peso</h3>`;
 if(A){h+=die('alt',A[1],A[2],'Altura',v=>{const m=medidas();return `${v} → <b>${m?m.cm:''} cm</b>`});
  if(A[5]!==0&&S.apar.h!=null)h+=die('peso',A[4],A[5],'Peso',v=>{const m=medidas();return `${v} → <b>${m&&m.kg!=null?m.kg:''} kg</b>`});
  const m=medidas();if(m&&m.kg!=null)h+=`<p><b>${m.cm} cm</b> e <b>${m.kg} kg</b>.</p>`}
 h+=`<h3 id="alvo-aparencia">Aparência</h3>`+die('marca',1,12,'Um traço marcante',v=>`${v} → <b>${esc(CR.MARCA[v-1])}</b>`);
 h+=`<label class="f" for="ap-c">Cabelo, pelos, penas ou escamas</label><input type="text" id="ap-c" data-ap="c" value="${esc(S.apar.c||'')}">`;
 h+=`<label class="f" for="ap-o">Olhos</label><input type="text" id="ap-o" data-ap="o" value="${esc(S.apar.o||'')}">`;
 h+=`<label class="f" for="ap-p">Pele</label><input type="text" id="ap-p" data-ap="p" value="${esc(S.apar.p||'')}">`;
 return h;
}
const perL=(c,v)=>{const P=perTab();return P?LI(P.t[c],v):v};
DIE_FX.pt1=(v)=>{S.per.t1=perL('t',v)};
DIE_FX.pt2=(v,k,auto)=>{if(auto)while(perL('t',v)===S.per.t1){v=rnd(8);S.d.pt2={v}}S.per.t2=perL('t',v)};
DIE_FX.pid=v=>{S.per.i=perL('i',v)};DIE_FX.pvi=v=>{S.per.b=perL('b',v)};DIE_FX.pdf=v=>{S.per.f=perL('f',v)};
DIE_FX.alt=v=>{S.apar.h=v;S.apar.w=null;delete S.d.peso};
DIE_FX.peso=v=>{S.apar.w=v};
DIE_FX.marca=v=>{S.apar.m=v};

/* =========================================================
   COERÊNCIA NAS ROLAGENS DA ORIGEM E DA RAÇA (P34b)
   ========================================================= */
function rolaRaca(){const v=rnd(100);let rid=faixa(RACA_SUP,v)[2],sid=null,ve=null;
 if(rid==='raro'){let e;do{ve=rnd(100);e=faixa(EXO,ve)}while(!e);[rid,sid]=exoRef(e).split(':')}
 return {rid,sid,v,ve,nota:''}}

/* =========================================================
   "ME SURPREENDA"
   ========================================================= */
function surpreenda(){
 const v3=rnd(100);S.d.antec={v:v3};DIE_FX.antec(v3);
 const v1=rnd(100);S.d.patria={v:v1};DIE_FX.patria(v1);
 const v2=rnd(100);S.d.assent={v:v2};DIE_FX.assent(v2,'assent',true);
 const RR=rolaRaca();S.d.racasug={v:RR.v,nota:RR.nota};if(RR.ve)S.d.exsug={v:RR.ve};else delete S.d.exsug;
 let rr=RR.rid,sbFix=RR.sid;
 S.sugRaca=rr;S.raca=rr;S.fmtEsc='21';
 const r=raca();if(sbFix){S.sub=sbFix}else if(r.subs.length>1){const vs=rnd(r.subs.length);S.d.subsug={v:vs};S.sub=r.subs[vs-1][0]}else S.sub=r.subs[0][0];
 S.gen=rnd(2)===1?'m':'f';S.estilo='';{const vn=rnd(12);S.d.nome={v:vn};S.nome=listaNome()[S.gen][vn-1]}
 {const x=listaSob();if(x){const v=rnd(12);S.d.sobre={v};S.sobrenome=x.s[v-1]}else S.sobrenome=''}
 if(S.raca==='golias'){const v=rnd(12);S.d.apel={v};S.apelido=NOMES2.A[v-1]}else S.apelido='';
 const vc=rnd(100);S.d.classesug={v:vc};S.sugClasse=faixa(CLASSE_SUP,vc)[2];S.classe=S.sugClasse;
 if(SUBCL[S.classe]){const l=SUBCL[S.classe];S.subcl=l[rnd(l.length)-1]}
 if(S.classe==='clerigo'){const all=Object.values(DEUSES).join(', ').split(', ');S.deus=all[rnd(all.length)-1];let g=0;while(combo12()&&g<50){if(rnd(6)===1)break;S.deus=all[rnd(all.length)-1];g++}}
 const d=idadeDados();if(d){const vi=rollN(d.n,d.s);S.d.idade={v:vi};S.idade=d.a+vi}else S.idade=null;
 S.estiloCl='';{const os=ORDEM_CLASSE[S.classe];if(os&&os.length>1)S.estiloCl=os[rnd(os.length)-1][0]}
 if(ordemCl()){S.perfil=rnd(PERFIS.length)-1;aplicaPerfil()}else{S.perfil='livre';pb8()}
 sugereFichas();
}

/* =========================================================
   RENDER E EVENTOS
   ========================================================= */
function render(keepScroll){
 const sc=$('#scroller'),y=sc.scrollTop;
 $('#app').innerHTML=`<section>${TELAS[S.step]()}</section>`;
 $('#rail').innerHTML=ETAPAS.map((e,i)=>`<button ${i===S.step?'aria-current="step"':''} class="${i<S.max||(i<=S.max&&valida(i)&&i!==S.step)?'done':''}" data-go="${i}" ${i>S.max?'disabled':''}>${i+1}. ${e}</button>`).join('');
 const txt=S.step===1?[DESC[S.raca],DESC_CL[S.classe]].filter(Boolean):[];
 const pn=$('#painel');pn.innerHTML=txt.map(x=>`<p>${esc(x)}</p>`).join('');pn.hidden=!txt.length;pn.scrollTop=0;
 $('#back').disabled=S.step===0;
 $('#next').disabled=!valida(S.step);
 $('#next').textContent=S.step===ETAPAS.length-1?'Pronto':'Continuar';
 $('#next').style.visibility=S.step===ETAPAS.length-1?'hidden':'visible';
 if(keepScroll)sc.scrollTop=y;
}
function go(n){S.step=n;S.max=Math.max(S.max,n);render();$('#scroller').scrollTop=0;const cur=$('nav.rail [aria-current]');if(cur)cur.scrollIntoView({inline:'center',block:'nearest'})}

document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g&&!g.disabled){go(+g.dataset.go);return}
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,v=b.dataset.v;
 if(a==='modo'){S.modo=v;render(true)}
 else if(a==='caminho'){S.caminho=v;render(true)}
 else if(a==='raca'){const [rid,sid]=v.split(':');escolheRaca(rid,sid)}
 else if(a==='sub'){if(S.sub===v)return;applyChange(()=>{S.sub=v;S.fichas=[];revelar('#alvo-classe')},'raca')}
 else if(a==='classe'){if(S.classe===v)return;applyChange(()=>{trocaClasse(v);revelar('#alvo-cl')},'classe')}
 else if(a==='fmt'){S.fmtEsc=v;S.fichas=[];render(true)}
 else if(a==='mora'){S.mora=v;render(true)}
 else if(a==='gen'){if(S.gen===v)return;S.gen=v;delete S.d.nome;render(true)}
 else if(a==='perfil'){S.perfil=v==='livre'?'livre':+v;aplicaPerfil();if(v!=='livre')sugereFichas();S.cr={};S.crSel={};render(true)}
 else if(a==='estilocl'){if(S.estiloCl===v)return;S.estiloCl=v;aplicaPerfil();sugereFichas();S.cr={};S.crSel={};render(true)}
 else if(a==='roll'){const n=+b.dataset.n,s=+b.dataset.s;setDie(b.dataset.key,rollN(n,s),true);const svg=document.querySelector(`[data-die="${b.dataset.key}"] svg`);if(svg)svg.classList.add('roll')}
 else if(a==='mesa'){const k=b.dataset.key;S.d[k]={...(S.d[k]||{}),mesa:true};render(true);const inp=document.querySelector(`[data-mesa="${k}"]`);if(inp)inp.focus()}
 else if(a==='mesaok'){const k=b.dataset.key;const inp=document.querySelector(`[data-mesa="${k}"]`);const n=+inp.dataset.n,s=+inp.dataset.s,x=Number(inp.value);
   if(!Number.isInteger(x)||x<n||x>n*s){S.d[k]={...(S.d[k]||{}),mesa:true,err:`Digite um número inteiro de ${n} a ${n*s}.`};render(true)}else setDie(k,x)}
 else if(a==='pb'){const k=b.dataset.k,d=+b.dataset.d,nv=S.pb[k]+d;if(nv<8||nv>15)return;const old=S.pb[k];S.pb[k]=nv;if(pbGasto()>27)S.pb[k]=old;S.cr={};S.crSel={};render(true)}
 else if(a==='crroll'){crRollOne();delete S.d.cr;render(true)}
 else if(a==='crall'){crRollAll();render(true)}
 else if(a==='perall'){const set=(k,n,sd)=>{const v=rollN(n,sd);S.d[k]={v};DIE_FX[k](v,k,true)};
   if(!S.per.t1)set('pt1',1,8);if(!S.per.t2)set('pt2',1,8);if(!S.per.i)set('pid',1,6);if(!S.per.b)set('pvi',1,6);if(!S.per.f)set('pdf',1,6);
   const A=altTab();if(A){if(S.apar.h==null)set('alt',A[1],A[2]);if(A[5]!==0&&S.apar.w==null)set('peso',A[4],A[5])}if(!S.apar.m)set('marca',1,12);render(true)}
 else if(a==='crmesa'){const {rows}=crBuild();const l=rows[rows.length-1];if(l)S.d['cr:'+l.k]={mesa:true};render(true);const i=$('#crmesa');if(i)i.focus()}
 else if(a==='crmesaok'){const {rows}=crBuild();const l=rows[rows.length-1];const x=Number($('#crmesa').value);
   if(!Number.isInteger(x)||x<l.n||x>l.n*l.s){S.d['cr:'+l.k]={mesa:true,err:`Digite um número inteiro de ${l.n} a ${l.n*l.s}.`}}
   else if(l.valid&&!l.valid(x)){S.d['cr:'+l.k]={mesa:true,err:'Esse número manda rolar de novo.'}}
   else{S.cr[l.k]=x;delete S.d['cr:'+l.k]}render(true)}
 else if(a==='crreset'){modal('Refazer a crônica inteira? Todas as rolagens desta etapa serão apagadas.',()=>{S.cr={};S.crSel={};Object.keys(S.d).filter(k=>k.startsWith('cr:')).forEach(k=>delete S.d[k]);render()},'Refazer','danger')}
 else if(a==='crsel'){const [k,val]=v.split(':');S.crSel[k]=k.startsWith('fs')?+val:val;render(true)}
 else if(a==='copiar'){const t=fichaTexto();const done=()=>{$('#copied').textContent='Texto copiado.'};
   try{navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done))}catch(_){fallbackCopy(t,done)}}
 else if(a==='imprimir'){try{window.print()}catch(_){}}
 else if(a==='enviar'){if(!S.enviando)enviarFicha()}
});
function fallbackCopy(t,done){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(_){}ta.remove()}

document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.ap){S.apar[t.dataset.ap]=t.value;return}
 if(t.dataset.env){S.env[t.dataset.env]=t.value;S.envErro='';return}
 if(['nome','sobrenome','apelido'].includes(t.dataset.bind)){S[t.dataset.bind]=t.value;$('#next').disabled=!valida(S.step);const nc=$('#nc');if(nc)nc.textContent=nomeCompleto()}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(['nome','sobrenome','apelido'].includes(t.dataset.bind)){render(true);return}
 if(t.dataset.bind==='regExtra'){S.regExtra=t.value;S.notaOrigem='';if(Object.keys(S.cr).length)S.cr={};render(true)}
 else if(t.dataset.bind==='regExtra2'){S.regExtra2=t.value;render(true)}
 else if(t.dataset.bind==='estilo'){S.estilo=t.value;delete S.d.nome;delete S.d.sobre;render(true)}
 else if(t.dataset.bind==='antec'){S.antec=t.value||null;S.cr={};S.crSel={};S.per={};render(true)}
 else if(t.dataset.bind==='resman'){if(t.value)S.crSel.res=t.value;else delete S.crSel.res;render(true)}
 else if(t.dataset.bind==='per'){const c=t.dataset.campo;if(t.value)S.per[c]=+t.value;else delete S.per[c];delete S.d[t.dataset.key];render(true)}
 else if(t.dataset.bind==='subcl'){S.subcl=t.value;render(true)}
 else if(t.dataset.bind==='deus'){S.deus=t.value;render(true)}
 else if(t.dataset.bind==='idade'){const d=idadeDados(),x=Number(t.value);const ok=d?(Number.isInteger(x)&&x>=d.min&&x<=d.max):(raca()&&raca().rara&&Number.isInteger(x)&&x>=1&&x<=2000);if(ok){S.idade=x;delete S.d.idade}else{S.idade=null}render(true)}
 else if(t.dataset.ficha){S.fichas[+t.dataset.ficha].a=t.value;S.cr={};S.crSel={};render(true)}
});

$('#back').onclick=()=>{if(S.step>0)go(S.step-1)};
$('#reset').onclick=()=>modal('Apagar tudo o que foi feito e voltar ao início?',()=>{
 Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,JSON.parse(S0));go(0);
},'Apagar tudo','danger');
$('#next').onclick=()=>{
 if(!valida(S.step))return;
 if(S.step===0&&S.caminho==='surpresa'&&!S.raca){surpreenda()}
 if(S.step<ETAPAS.length-1)go(S.step+1);
};
render();
</script>
</body>
</html>
