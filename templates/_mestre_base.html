<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{% block titulo %}Fichas dos Jogadores{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@600;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Mesmo papel e tinta do gerador: lista densa para o mestre consultar */
:root{
  --bg:#E8EDF1; --surface:#F6F8FA; --ink:#14283A; --muted:#4E6272; --line:#B8C4CE;
  --brass:#8A6A12; --brass-soft:#E9DDB6;
  --serif:"Alegreya", Georgia, serif; --sans:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#0F2233;--surface:#16304A;--ink:#EAE3D2;--muted:#9FB0BE;--line:#2C4A66;--brass:#D4AF37;--brass-soft:#3A3620;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:860px;margin:0 auto}
h1{font:800 clamp(1.6rem,5vw,2.1rem)/1.1 var(--serif);margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 18px}
a{color:var(--ink)}
form.busca{display:flex;gap:8px;margin-bottom:14px}
form.busca input{flex:1;min-width:0;font:1rem var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.btn{font:700 1rem var(--sans);border-radius:10px;padding:9px 14px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg);text-decoration:none;display:inline-block}
.btn.sec{background:transparent;color:var(--ink)}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:none}
td.quando{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
td.pers a{font-family:var(--serif);font-weight:800;font-size:1.05rem}
.vazio{padding:24px;color:var(--muted)}
@media (max-width:620px){
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{padding:10px 12px;border-bottom:1px solid var(--line)}
  tr:last-child{border-bottom:none}
  td{border:none;padding:1px 0;overflow-wrap:anywhere}
  td.quando{font-size:.88rem}
}
pre.ficha{white-space:pre-wrap;font-family:var(--serif);font-size:1rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 16px}
dt{color:var(--muted)}dd{margin:0;min-width:0;overflow-wrap:anywhere}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.ok{color:var(--brass);font-weight:700}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
</style>
</head>
<body><div class="wrap">{% block corpo %}{% endblock %}</div></body>
</html>
