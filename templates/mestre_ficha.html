{% extends "_mestre_base.html" %}
{% block titulo %}{{ f['personagem'] }}{% endblock %}
{% block corpo %}
<p><a href="/mestre">← Todas as fichas</a></p>
<h1>{{ f['personagem'] }}</h1>
<p class="sub">{{ f['resumo'] }}</p>
<dl>
  <dt>Jogador</dt><dd>{{ f['jogador'] }}</dd>
  <dt>E-mail</dt><dd>{{ f['email'] }}</dd>
  <dt>Enviada</dt><dd>{{ f['criada_em']|data }}</dd>
</dl>
<pre class="ficha" id="ficha">{{ f['texto'] }}</pre>
<div class="row">
  <button class="btn" type="button" id="copiar">Copiar ficha</button>
  <span class="ok" id="copiado" aria-live="polite"></span>
</div>
<script>
document.getElementById('copiar').onclick=function(){
  var t=document.getElementById('ficha').textContent, msg=document.getElementById('copiado');
  function feito(){msg.textContent='Ficha copiada.'}
  function plano(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');feito()}catch(e){}ta.remove()}
  try{navigator.clipboard.writeText(t).then(feito,plano)}catch(e){plano()}
};
</script>
{% endblock %}
